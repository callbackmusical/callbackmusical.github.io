<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALLBACK</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <h1>CALLBACK</h1>
    <div style="margin-top:-40px;">
      <span>an <a href="/about">original comedy musical</a></span>
      <span>live at <a href="https://imposterstheater.com/">imposters theater</a></span>
      <span>labor day weekend</span>
    </div>
    
    <div id="ticket-link"></div>

    <h2>SHOWS</h2>
    <ul>
      <li>Friday, August 29 @ 9:30 p.m.</li>
      <li>Saturday, August 30 @ 7:00 p.m.</li>
      <li>Saturday, August 30 @ 9:30 p.m.</li>
      <li>Sunday, August 31 @ 7:30 p.m.</li>
    </ul>

    <br>

    <p><a href="/about"><i>Click here to read more about the show!</i></a></p>

    <p><a href="https://www.instagram.com/callbackmusical" class="fa fa-instagram"></a><a href="https://www.facebook.com/profile.php?id=61575756992032" class="fa fa-facebook"></a></p>

    <div style="height: 100px;"></div>
    <script>
      const ticketLink = document.getElementById("ticket-link");
      const ticketInner = `<a target="_blank" href="https://www.imposterstheater.com/current/p/callback-an-original-comedy-musical">Click here to buy tickets!</a>`;
      // Set the date we're counting down to
      var countDownDate = new Date("Jul 1, 2025 10:00:00").getTime();

      function intFun() {
        // Get today's date and time
        var now = new Date().getTime();

        // Find the distance between now and the count down date
        var distance = countDownDate - now;

        if (distance < 0) {
          ticketLink.innerHTML = ticketInner;
          return;
        }

        // Time calculations for days, hours, minutes and seconds
        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const timeTil = `<i>tickets go on sale <br><b>Tuesday, July 1st at 10AM</b><br>(check back here ${days} day${days === 1 ? "" : "s"}, ${hours} hour${hours === 1 ? "" : "s"}, ${minutes} minute${minutes === 1 ? "" : "s"} and ${seconds} second${seconds === 1 ? "" : "s"} from now)</i>`;

        // Output the result in an element with id="demo"
        ticketLink.innerHTML = timeTil;
      }

      function startCountdown() {

        // Update the count down every 1 second
        setInterval(intFun, 1000);
      }

      intFun();
      startCountdown();
    </script>
  </body>
</html>
